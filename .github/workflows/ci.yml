name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
        env:
          CONFIGSENTINEL_DEBUG: "true"
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: configsentinel
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d configsentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Create non-superuser database owner
        env:
          PGPASSWORD: postgres-ci
        run: |
          psql -h localhost -U postgres -d postgres -c "CREATE ROLE configsentinel_owner LOGIN PASSWORD 'owner-ci' CREATEDB NOSUPERUSER NOBYPASSRLS;"
          psql -h localhost -U postgres -d postgres -c "ALTER DATABASE configsentinel OWNER TO configsentinel_owner;"
      - run: python manage.py test
        env:
          CONFIGSENTINEL_DEBUG: "true"
          CONFIGSENTINEL_DATABASE_URL: postgresql://configsentinel_owner:owner-ci@localhost:5432/configsentinel


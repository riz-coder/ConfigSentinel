{% extends "base.html" %}
{% block title %}Sign in · ConfigSentinel{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:auto">
  <h1>Sign in</h1>
  {% if form.errors %}<p>Invalid username or password.</p>{% endif %}
  <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Sign in</button></form>
</div>
{% endblock %}

services:
  web:
    command: gunicorn configsentinel.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile -
    restart: unless-stopped
    volumes: []
    ports: []
    expose:
      - "8000"
  db:
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:

